<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>分享__MEDIA_NAME__ · NoRule URL</title>
  <link rel="stylesheet" href="/web/app.css" />
</head>
<body class="short-url-page image-view-page">
<main class="image-view-shell">
  <header class="image-view-header">
    <a class="short-url-brand" href="/" aria-label="NoRule URL home">
      <span class="short-url-brand-mark">NR</span>
      <span>NoRule URL</span>
    </a>
    <a class="image-view-home" href="/">建立短網址</a>
  </header>

  <section class="image-view-intro">
    <div>
      <span class="short-url-eyebrow">__MEDIA_EYEBROW__</span>
      <h1>分享__MEDIA_NAME__</h1>
      <p>由 NoRule URL 安全託管的__MEDIA_NAME__內容。</p>
    </div>
    <span class="image-view-status">LIVE / __IMAGE_STATUS__</span>
  </section>

  <section class="image-view-layout">
    <figure class="image-view-stage">
      __MEDIA_ELEMENT__
    </figure>

    <aside class="image-view-details" aria-label="__MEDIA_NAME__資訊">
      <div class="image-view-code">
        <span>短網址代碼</span>
        <strong>__IMAGE_CODE__</strong>
      </div>
      <dl class="image-view-stats">
        <div>
          <dt>瀏覽次數</dt>
          <dd>__IMAGE_VIEWS__</dd>
        </div>
        <div>
          <dt>到期時間</dt>
          <dd>__IMAGE_EXPIRES__</dd>
        </div>
        <div>
          <dt>__MEDIA_NAME__格式</dt>
          <dd>__IMAGE_TYPE__</dd>
        </div>
        <div>
          <dt>檔案大小</dt>
          <dd>__IMAGE_SIZE__</dd>
        </div>
      </dl>
    </aside>
  </section>
</main>
</body>
</html>
