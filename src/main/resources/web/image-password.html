<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>受密碼保護 · NoRule URL</title>
  <link rel="stylesheet" href="/web/app.css" />
</head>
<body class="short-url-page image-password-page">
<main class="image-password-shell">
  <a class="short-url-brand" href="/" aria-label="NoRule URL home">
    <span class="short-url-brand-mark">NR</span>
    <span>NoRule URL</span>
  </a>
  <section class="image-password-card">
    <span class="image-password-icon" aria-hidden="true">01</span>
    <span class="short-url-eyebrow">ACCESS / PROTECTED MEDIA</span>
    <h1>這張圖片受到保護</h1>
    <p>輸入分享者設定的密碼後即可進入圖片瀏覽頁。</p>
    <form id="password-form" class="short-url-form">
      <label class="short-url-field" for="password">
        <span>密碼</span>
        <input id="password" name="password" type="password" minlength="4" maxlength="128" required autofocus />
      </label>
      <button type="submit" class="short-url-submit short-url-submit--image">查看圖片</button>
      <p id="error" class="short-url-error hidden" role="alert">密碼錯誤，請重新輸入。</p>
    </form>
  </section>
</main>
<script>
  document.getElementById('password-form').addEventListener('submit', async (event) => {
    event.preventDefault();
    const response = await fetch('/api/short/image/access/__IMAGE_CODE__', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
      body: new URLSearchParams({ password: document.getElementById('password').value })
    });
    if (response.ok) {
      window.location.reload();
      return;
    }
    const error = document.getElementById('error');
    const submit = event.currentTarget.querySelector('button[type="submit"]');
    let payload = {};
    try { payload = await response.json(); } catch { /* Use the generic message below. */ }
    error.textContent = payload.error || (response.status === 429
      ? '密碼嘗試過於頻繁，請稍後再試。'
      : '密碼錯誤，請重新輸入。');
    error.classList.remove('hidden');
    const retryAfter = Number(payload.retryAfterSeconds || response.headers.get('Retry-After') || 0);
    if (retryAfter > 0 && submit) {
      submit.disabled = true;
      window.setTimeout(() => { submit.disabled = false; }, retryAfter * 1000);
    }
  });
</script>
</body>
</html>
