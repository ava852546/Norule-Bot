# Discord Bot Token (or set DISCORD_TOKEN env var)
token: ""

# Discord API login resilience
discord:
  loginRetry:
    enabled: true
    maxAttempts: 8
    initialDelaySeconds: 5
    maxDelaySeconds: 60

# Command prefix
prefix: "!"

# Enable debug logging
debug: false

# Runtime dependency bootstrap download behavior
runtime-dependencies:
  progress-enabled: true
  progress-interval-ms: 2000
  connect-timeout-ms: 10000
  read-timeout-ms: 60000
  stall-timeout-ms: 15000
  max-retries: 3

# Restrict slash command registration to a guild ID (empty = global)
commandGuildId: ""

# Data and resource paths
data:
  guildSettingsDir: "guild/configs"
  languageDir: "lang"
  musicDir: "guild/music"
  moderationDir: "guild/moderation"
  ticketDir: "guild/tickets"
  ticketTranscriptDir: "ticket-transcripts"
  honeypotDir: "guild/honeypot"
  logDir: "logs"

# Default language
defaultLanguage: "zh-TW"

# Command cooldown in seconds
commandCooldownSeconds: 3

# Number-chain reaction delay in milliseconds
numberChainReactionDelayMillis: 500

# Bot profile / presence
bot:
  description: 'NoRule Music Bot | /help'
  presenceStatus: "ONLINE"
  activityType: "LISTENING"
  rotationSeconds: 20
  activities:
    - "LISTENING|NoRule Music Bot"
  activityText: "NoRule Music Bot"

# Developer whitelist IDs
developers:
  ids: []
  # Destination channel for /report (bug reports & feedback). 0 or unset disables the command.
  developerChannelId: 0

# Global music integrations
music:
  youtube:
    # Startup-only YouTube playback backend: YOUTUBE_SOURCE or COMPANION.
    # youtube_source, YOUTUBE_SOURCE, and youtube-source are accepted; invalid values fall back safely.
    playbackBackend: YOUTUBE_SOURCE
    # Invidious Companion is used only for YouTube audio playback; youtube-source still handles search and metadata.
    companion:
      # Must be true before COMPANION can make API requests. Environment: YOUTUBE_COMPANION_ENABLED.
      enabled: false
      # Companion origin or base URL. A bare origin uses the official default /companion base path.
      # Environment: YOUTUBE_COMPANION_URL.
      url: "http://127.0.0.1:8282"
      # Must match Companion SERVER_SECRET_KEY (exactly 16 alphanumeric characters). Never log or commit a real secret.
      # Environment: YOUTUBE_COMPANION_SECRET.
      secret: ""
      # On Companion timeout, offline, or HTTP 5xx, try youtube-source once. Environment: YOUTUBE_COMPANION_FALLBACK_TO_SOURCE.
      fallbackToSource: true
      # TCP connection timeout for Companion metadata and playback proxy requests.
      # Environment: YOUTUBE_COMPANION_CONNECT_TIMEOUT_MILLIS.
      connectTimeoutMillis: 5000
      # Overall player API timeout and playback proxy socket timeout.
      # Environment: YOUTUBE_COMPANION_REQUEST_TIMEOUT_MILLIS.
      requestTimeoutMillis: 10000
    auth:
      mode: NONE
      strictAuthConfig: false
      poToken: ""
      visitorData: ""
      oauthRefreshToken: ""
    # Legacy OAuth keys remain supported for existing installations.
    oauthEnabled: false
    oauthRefreshToken: ""
    cipherEnabled: false
    cipherServer: "http://localhost:8001"
    cipherPassword: "test"
    cipherUserAgent: "norule-music-bot"
    # Optional strict queue precheck using youtube-source plugin GET /youtube/stream/{videoId}.
    # Enable only when lavalinkBaseUrl/lavalinkPassword point to a Lavalink node with youtube-plugin installed.
    strictPrecheck:
      enabled: false
      cacheTtlHours: 24
      cache:
        playableTtlHours: 24
        temporaryFailureTtlMinutes: 10
        permanentFailureTtlHours: 24
      timeoutMillis: 5000
      lavalinkBaseUrl: ""
      lavalinkPassword: ""
  spotify:
    enabled: false
    clientId: ""
    clientSecret: ""
    spDc: ""
    countryCode: "TW"
    preferAnonymousToken: true
    customTokenEndpoint: ""
    playlistMaxTracks: 50
    playlistLoadCooldownSeconds: 60
  audio:
    direct-http:
      enabled: false
      connect-timeout-ms: 5000
      read-timeout-ms: 10000
      max-redirects: 3
      # Direct HTTP stays unavailable until at least one trusted host is listed.
      allowed-hosts: []
    recovery:
      enabled: true
      max-stuck-retries: 2
      resume-rewind-ms: 2000
      stuck-threshold-ms: 20000

# English word-chain dictionary providers
dictionary:
  connectTimeoutSeconds: 5
  requestTimeoutSeconds: 5
  freeDictionary:
    enabled: true
    endpoint: "https://api.dictionaryapi.dev/api/v2/entries/en/"
  merriamWebster:
    enabled: true
    endpoint: "https://www.dictionaryapi.com/api/v3/references/collegiate/json/"
    # MERRIAM_WEBSTER_API_KEY takes precedence over this value.
    apiKey: ""

# Web control panel
web:
  enabled: false
  bind:
    host: "0.0.0.0"
    port: 60000
  public:
    baseUrl: "https://dash.example.com"
  sessionExpireMinutes: 720
  discordClientId: ""
  discordClientSecret: ""
  discordRedirectUri: "https://dash.example.com/auth/callback"
  ssl:
    enabled: false
    certDir: "certs"
    privateKeyFile: "privkey.pem"
    fullChainFile: "fullchain.pem"
    keyStoreFile: "web-keystore.p12"
    keyStoreType: "PKCS12"
    keyStorePassword: ""
    keyPassword: ""

# Shared database settings
database:
  storage: "sqlite"
  mysql:
    jdbcUrl: "jdbc:mysql://localhost:3306/data?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
    username: "root"
    password: ""
    poolSize: 8
  sqlite:
    path: "data/norule.db"

# Short URL service
# 啟用媒體分享時必須設定下方 secrets，或使用環境變數
# SHORT_URL_QUOTA_HMAC_SECRET 與 SHORT_URL_DEVICE_HMAC_SECRET（環境變數優先）。
shortUrl:
  enabled: false
  bindHost: "0.0.0.0"
  bindPort: 60001
  publicBaseUrl: "https://s.norule.me"
  codeLength: 7
  allowPrivateTargets: false
  dedupe: true
  ttlDays: 7
  cleanupIntervalMinutes: 10
  image:
    enabled: true
    defaultRetentionHours: 1
    maxRetentionDays: 365
    maxFileSizeMb: 20
    maxVideoFileSizeMb: 100
    maxVideoDurationSeconds: 300
    expiredShareRetentionDays: 30
    storagePath: "data/short-url-images"
    abuseProtection:
      secrets:
        # 請使用兩組獨立、長期固定的隨機值；不要把真實 secret 提交到版本控制。
        quotaHmacSecret: ""
        deviceHmacSecret: ""
      identityContinuity:
        enabled: true
        anonymousToAccountMergeWindowMinutes: 120
        deviceLinkTtlDays: 30
        deviceAccountSwitchCooldownHours: 24
      passwordProtection:
        enabled: true
        # 保留既有 MMdd 預設密碼；設為 false 後，空白密碼會以 MEDIA_PASSWORD_REQUIRED 拒絕。
        allowDateDefaultPassword: true
        minPasswordLength: 4
        maxPasswordLength: 128
        maxFailedAttempts: 5
        failureWindowMinutes: 10
        lockMinutes: 10
        backoffInitialSeconds: 1
        backoffMultiplier: 2
        backoffMaxSeconds: 30
        maxConcurrentVerifications: 8
        perIp:
          maxVerificationRequestsPerMinute: 20
          maxVerificationRequestsPer10Minutes: 100
      storage:
        activePath: "data/short-url-images"
        tempPath: "data/tmp/uploads"
        expiredArchivePath: "data/short-url-expired"
        maxTotalStorageGb: 50
        warningPercent: 70
        filesystemStopPercent: 80

# Minecraft status query settings
minecraftStatus:
  userAgent: "NoRuleBot/1.0 contact: admin@norule.me"
  requestTimeoutMillis: 15000
  internalCacheSeconds: 60
