# =============================================================================
# 核心執行環境
# =============================================================================

# 文字指令前綴
prefix: "!"

# 啟用除錯日誌
debug: false

# 執行階段依賴下載設定
runtime-dependencies:
  progress-enabled: true
  progress-interval-ms: 2000
  connect-timeout-ms: 10000
  read-timeout-ms: 60000
  stall-timeout-ms: 15000
  max-retries: 3

# 限制斜線指令註冊的伺服器 ID（空白表示全域）
commandGuildId: ""

# 預設語言
defaultLanguage: "zh-TW"

# 指令冷卻時間（秒）
commandCooldownSeconds: 3

# 數字接龍反應延遲（毫秒）
numberChainReactionDelayMillis: 500

# =============================================================================
# Discord 連線與監控
# =============================================================================
discord:
  loginRetry:
    enabled: true
    maxAttempts: 8
    initialDelaySeconds: 5
    maxDelaySeconds: 60
  monitoring:
    resourceIntervalSeconds: 60
    offlineWarningSeconds: 300
    warningRepeatSeconds: 300
    # 僅在外部程序管理器可接手重啟時啟用（Pterodactyl/Wings；退出碼 75）。
    recoveryEnabled: false
    restartAfterSeconds: 1800
    # 無進展時間也須至少達到 JDA 最大重連延遲的兩倍加 60 秒。
    stalledReconnectSeconds: 1800
    # 持久化額度：data/monitoring/gateway-recovery.count；僅允許手動重設。
    maxRecoveryRestarts: 3
    restartCooldownSeconds: 60

  # ---------------------------------------------------------------------------
  # Discord 運行日誌；與 monitoring 的監控邏輯設定分開。
  # ---------------------------------------------------------------------------
  logging:
    jvmHeartbeat:
      # 頻道 ID 使用字串；0、空白或未設定表示停用。
      channelId: "0"
      # UPDATE_LATEST 更新本 Bot 的心跳訊息；NEW_MESSAGE 每次新增一則。
      deliveryMode: UPDATE_LATEST
    voiceAutoLeave:
      channelId: "0"


# =============================================================================
# Bot 身分與開發者存取
# =============================================================================

# Bot 個人資料與上線狀態
bot:
  description: 'NoRule Music Bot | /help'
  presenceStatus: "ONLINE"
  rotationSeconds: 20
  activities:
    - "LISTENING|NoRule Music Bot"

# 開發者白名單 ID
developers:
  ids: []
  # /report 錯誤回報與意見接收頻道；0 或未設定表示停用。
  developerChannelId: 0

# =============================================================================
# 音樂與音訊
# =============================================================================
music:
  musicPanelMode: MODERN
  bilibili:
    enabled: true
    # 選用的一般工作階段 Cookie；環境變數 BILIBILI_COOKIE；不得提交真實帳號 Cookie。
    cookie: ""
    metadataCache:
      enabled: true
      ttlHours: 12
      maxEntries: 1000
    rateLimit:
      enabled: true
      requestsPerSecond: 1
      burst: 3
    circuitBreaker:
      enabled: true
      failureThreshold: 3
      windowSeconds: 60
      cooldownSeconds: 300
  youtube:
    # 啟動時決定直接連結、搜尋、Spotify、歌單與恢復曲目的播放擷取後端。
    # COMPANION 僅在明確啟用 companion.fallbackToSource 時切換後端。
    # 兩種模式皆由 youtube-source 提供搜尋與中繼資料。
    # 支援的後端：YOUTUBE_SOURCE 或 COMPANION。
    # 接受 youtube_source、YOUTUBE_SOURCE 與 youtube-source；無效值安全退回預設。
    playbackBackend: YOUTUBE_SOURCE
    # Invidious Companion 僅負責 YouTube 音訊播放；搜尋與中繼資料仍由 youtube-source 處理。
    companion:
      # 須啟用才允許 COMPANION 發出 API 請求；環境變數 YOUTUBE_COMPANION_ENABLED。
      enabled: false
      # Companion 來源或基底網址；僅填來源時使用預設 /companion 路徑。
      # 環境變數：YOUTUBE_COMPANION_URL。
      url: "http://127.0.0.1:8282"
      # 須符合 Companion SERVER_SECRET_KEY（恰為 16 個英數字元）；不得記錄或提交真實秘密。
      # 環境變數：YOUTUBE_COMPANION_SECRET。
      secret: ""
      # Companion 逾時、離線或 HTTP 5xx 時嘗試 youtube-source 一次；環境變數 YOUTUBE_COMPANION_FALLBACK_TO_SOURCE。
      # 跨後端備援須明確啟用；否則失敗後仍使用 COMPANION。
      fallbackToSource: false
      # Companion 中繼資料與播放代理請求的 TCP 連線逾時。
      # 環境變數：YOUTUBE_COMPANION_CONNECT_TIMEOUT_MILLIS。
      connectTimeoutMillis: 5000
      # 播放器 API 整體逾時及播放代理通訊端逾時。
      # 環境變數：YOUTUBE_COMPANION_REQUEST_TIMEOUT_MILLIS。
      requestTimeoutMillis: 10000
    # 選用嚴格入列預檢，使用 youtube-source 外掛 GET /youtube/stream/{videoId}。
    # 僅在 lavalinkBaseUrl/lavalinkPassword 指向已安裝 youtube-plugin 的節點時啟用。
    strictPrecheck:
      enabled: false
      cacheTtlHours: 24
      cache:
        playableTtlHours: 24
        temporaryFailureTtlMinutes: 10
        permanentFailureTtlHours: 24
      timeoutMillis: 5000
      lavalinkBaseUrl: ""
      lavalinkPassword: ""
  oauth:
    enabled: false
    refreshToken: ""
  cipher:
    # 控制 YOUTUBE_SOURCE 路徑中的獨立本機或遠端 Cipher。
    # false 禁止此整合，包含備援與恢復。
    # 不影響 Invidious Companion 內部的簽章與解碼處理。
    # 環境變數不得覆寫 enabled=false。
    enabled: false
    server: "http://localhost:8001"
    password: ""
    userAgent: "norule-music-bot"
  spotify:
    enabled: false
    clientId: ""
    clientSecret: ""
    spDc: ""
    countryCode: "TW"
    preferAnonymousToken: true
    playlistMaxTracks: 50
    playlistLoadCooldownSeconds: 60
  audio:
    direct-http:
      enabled: false
      connect-timeout-ms: 5000
      read-timeout-ms: 10000
      max-redirects: 3
      # 至少列出一個可信任主機後才可使用直接 HTTP。
      allowed-hosts: []
    recovery:
      enabled: true
      max-stuck-retries: 2
      resume-rewind-ms: 2000
      stuck-threshold-ms: 20000

# =============================================================================
# 外部整合：單字接龍字典
# =============================================================================
dictionary:
  connectTimeoutSeconds: 3
  requestTimeoutSeconds: 4
  cache:
    enabled: true
    foundTtlHours: 24
    notFoundTtlMinutes: 30
    temporaryFailureTtlSeconds: 10
    maxEntries: 10000
  freeDictionary:
    enabled: true
    endpoint: "https://api.dictionaryapi.dev/api/v2/entries/en/"
    retry:
      enabled: true
      maxAttempts: 2
      initialDelayMillis: 250
    circuitBreaker:
      enabled: true
      failureThreshold: 5
      cooldownSeconds: 60
  merriamWebster:
    enabled: true
    endpoint: "https://www.dictionaryapi.com/api/v3/references/collegiate/json/"
    # 環境變數 MERRIAM_WEBSTER_API_KEY 優先於此值。
    apiKey: ""

# =============================================================================
# Web 控制台
# =============================================================================
web:
  enabled: false
  bind:
    port: 60000
  public:
    baseUrl: "https://dash.example.com"
  sessionExpireMinutes: 720
  discordClientId: ""
  discordClientSecret: ""
  discordRedirectUri: "https://dash.example.com/auth/callback"

# =============================================================================
# 資料與資源路徑
# =============================================================================
data:
  guildSettingsDir: "guild/configs"
  languageDir: "lang"
  musicDir: "guild/music"
  moderationDir: "guild/moderation"
  ticketDir: "guild/tickets"
  ticketTranscriptDir: "ticket-transcripts"
  honeypotDir: "guild/honeypot"
  logDir: "logs"

# =============================================================================
# 資料庫與儲存
# =============================================================================
database:
  storage: "sqlite"
  mysql:
    jdbcUrl: "jdbc:mysql://localhost:3306/data?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
    username: "root"
    password: ""
    poolSize: 8
  sqlite:
    path: "data/norule.db"

# =============================================================================
# 短網址
# =============================================================================
# 啟用媒體分享時必須設定下方 secrets，或使用環境變數
# SHORT_URL_QUOTA_HMAC_SECRET 與 SHORT_URL_DEVICE_HMAC_SECRET（環境變數優先）。
shortUrl:
  enabled: false
  bindPort: 60001
  publicBaseUrl: "https://example.com/"
  codeLength: 7
  allowPrivateTargets: false
  dedupe: true
  ttlDays: 7
  # 僅適用於新建匿名 HTTP 網址；保留既有到期時間。
  # 已登入使用者的 HTTP 網址不自動到期；ttlDays 仍供內部呼叫使用。
  anonymous:
    expirationEnabled: false
    expirationDays: 30
    turnstile:
      enabled: false
      siteKey: ""
      # 秘密僅從 TURNSTILE_SECRET 讀取；不得存於此檔。
  cleanupIntervalMinutes: 10
  abuseProtection:
    rateLimit:
      enabled: true
      # 匿名上傳使用嚴格 IP 配額。
      mediaRequestsPerMinutePerIp: 10
      # 登入上傳仍共用 IP 防濫用上限，並以使用者配額為準。
      mediaAuthenticatedRequestsPerMinutePerIp: 60
      mediaRequestsPerMinutePerUser: 20
      # 計入每次登入 HTTP 上傳請求，包含去重與分享重用。
      mediaRequestsPerDayPerUser: 200
      # 匿名短網址請求同時套用三種滾動時間視窗。
      shortUrlRequestsPerMinutePerIp: 10
      shortUrlRequestsPerHourPerIp: 30
      shortUrlRequestsPerDayPerIp: 100
      shortUrlRequestsPerMinutePerUser: 20
      shortUrlAuthenticatedRequestsPerMinutePerIp: 60
      # 短網址建立、清單、統計與管理請求共用；不含公開資源與工作階段。
      shortUrlApiRequestsPerDayPerUser: 200
      mediaConcurrencyPerIp: 2
      mediaConcurrencyPerUser: 3
      # 僅信任由下列代理送達請求的 X-Forwarded-For。
      trustedProxyCidrs:
        - "127.0.0.1/32"
        - "::1/128"
    creation:
      # 保留舊版額外請求與成功建立保護，以維持相容性。
      enabled: true
      anonymous:
        maxRequestsPerMinute: 10
        maxRequestsPer10Minutes: 50
        maxCreatesPerDay: 200
      authenticated:
        maxRequestsPerMinute: 30
        maxRequestsPer10Minutes: 200
        maxCreatesPerDay: 500
  image:
    enabled: true
    defaultRetentionHours: 1
    maxRetentionDays: 365
    maxFileSizeMb: 20
    maxVideoFileSizeMb: 100
    maxVideoDurationSeconds: 300
    expiredShareRetentionDays: 30
    storagePath: "data/short-url-images"
    abuseProtection:
      secrets:
        # 各填一組獨立且長期固定的 64 位十六進位字串（32 個隨機 bytes）。
        # 可分別使用 openssl rand -hex 32 產生；變更後既有裝置身分與配額雜湊會失效。
        quotaHmacSecret: ""
        deviceHmacSecret: ""
      identityContinuity:
        enabled: true
        anonymousToAccountMergeWindowMinutes: 120
        deviceLinkTtlDays: 30
        deviceAccountSwitchCooldownHours: 24
      passwordProtection:
        enabled: true
        # 保留既有 MMdd 預設密碼；設為 false 後，空白密碼會以 MEDIA_PASSWORD_REQUIRED 拒絕。
        allowDateDefaultPassword: true
        minPasswordLength: 4
        maxPasswordLength: 128
        maxFailedAttempts: 5
        failureWindowMinutes: 10
        lockMinutes: 10
        backoffInitialSeconds: 1
        backoffMultiplier: 2
        backoffMaxSeconds: 30
        maxConcurrentVerifications: 8
        perIp:
          maxVerificationRequestsPerMinute: 20
          maxVerificationRequestsPer10Minutes: 100
      storage:
        activePath: "data/short-url-images"
        tempPath: "data/tmp/uploads"
        expiredArchivePath: "data/short-url-expired"
        maxTotalStorageGb: 50
        warningPercent: 70
        filesystemStopPercent: 80

# =============================================================================
# 其他服務：Minecraft 狀態
# =============================================================================
minecraftStatus:
  userAgent: "NoRuleBot/1.0 contact: admin@norule.me"
  requestTimeoutMillis: 15000
  internalCacheSeconds: 60
