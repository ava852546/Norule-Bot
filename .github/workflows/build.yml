
name: Norule-Bot CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build and Test Norule-Bot
        run: mvn -B --no-transfer-progress clean package

      - name: Verify Runtime Dependency Artifacts
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          from zipfile import ZipFile

          target = Path('target')
          manifest = target / 'classes/bootstrap/runtime-dependencies.txt'
          checksums = target / 'classes/bootstrap/runtime-dependency-checksums.txt'
          entries = [line.split('|') for line in manifest.read_text().splitlines()
                     if line and not line.startswith('#')]
          assert entries, 'Runtime dependency manifest is empty'
          for group, artifact, version, classifier, extension, repository, checksum in entries:
              assert repository in {'central', 'lavalink-releases', 'topiwtf-releases'}, repository
              name = f'{artifact}-{version}' + (f'-{classifier}' if classifier else '') + f'.{extension}'
              jar = target / 'runtime-libs' / name
              assert hashlib.sha256(jar.read_bytes()).hexdigest() == checksum, name
          jars = list(target.glob('*.jar'))
          assert jars, 'Main JAR is missing'
          for jar in jars:
              with ZipFile(jar) as packaged:
                  for source in (manifest, checksums):
                      assert packaged.read('bootstrap/' + source.name) == source.read_bytes(), source.name
          print(f'Verified {len(entries)} runtime dependencies and packaged manifests')
          PY

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Norule-Bot-1.8
          path: target/discord-music-bot-1.8.jar
          if-no-files-found: error
          retention-days: 14
